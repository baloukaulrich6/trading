[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nkap"
version = "0.1.0"
description = "Recherche quantitative et contrôle de risque pour Nkap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2",
    "numpy>=1.26",
    "pydantic>=2",
    "PyYAML>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5; sys_platform == 'win32'", "anthropic"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
nkap-backtest = "nkap.backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
line-length = 110

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
files = ["src/nkap/domaine", "src/nkap/risque", "src/nkap/execution"]
